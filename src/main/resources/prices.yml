# Your own sell prices, used by auto sell when CUSTOM is listed in collection.price-providers.
# With prices here, no shop plugin is needed at all. A price is per single item, so 64 of
# something sells for 64 times the number below. Remove an item to let the next provider in
# the list decide, or set it to 0 to make it worthless.
