# =============================================================
#                     Upgrade tier curves
# =============================================================
# Each track is a map of tier-number -> { price, ...effect }.
# Tier 1 should be price 0 (the starting tier on a freshly given Collector).
# =============================================================

speed:
  display-name: "Speed"
  icon: SUGAR
  1: { interval-ticks: 40, price: 0 }
  2: { interval-ticks: 30, price: 1000 }
  3: { interval-ticks: 20, price: 5000 }
  4: { interval-ticks: 10, price: 25000 }
  5: { interval-ticks: 5,  price: 100000 }

# Range is in CHUNKS. 1 = own chunk only, 2 = 3x3 chunks, 3 = 5x5, etc.
range:
  display-name: "Range"
  icon: SPYGLASS
  1: { chunks: 1, price: 0 }
  2: { chunks: 2, price: 5000 }
  3: { chunks: 3, price: 25000 }
  4: { chunks: 4, price: 100000 }
  5: { chunks: 5, price: 500000 }

# Capacity = number of distinct materials the Collector can hold.
# Each page in the GUI displays 28 materials, so divide / 28 to get pages.
capacity:
  display-name: "Capacity"
  icon: ENDER_CHEST
  1: { max-storage-slots: 28,  price: 0      }   # 1 page
  2: { max-storage-slots: 56,  price: 5000   }   # 2 pages
  3: { max-storage-slots: 112, price: 20000  }   # 4 pages
  4: { max-storage-slots: 224, price: 75000  }   # 8 pages
  5: { max-storage-slots: 448, price: 250000 }   # 16 pages

autosell:
  display-name: "Auto-Sell"
  icon: GOLD_INGOT
  # Used as fallback when EconomyShopGUI isn't installed (or doesn't price the item).
  prices:
    DIAMOND: 50.0
    EMERALD: 30.0
    GOLD_INGOT: 10.0
    IRON_INGOT: 5.0
    COAL: 1.0
    COBBLESTONE: 0.05

autosmelt:
  display-name: "Auto-Smelt"
  icon: BLAST_FURNACE
  overrides:
    RAW_IRON: IRON_INGOT
    RAW_GOLD: GOLD_INGOT
    RAW_COPPER: COPPER_INGOT
    COBBLESTONE: STONE
    SAND: GLASS
