# =============================================================
#                  Français (fr) — fichier de langue
# =============================================================

prefix: "<gold><bold>Collector</bold> <dark_gray>»</dark_gray> "

general:
  no-permission: "<red>Vous n'avez pas la permission."
  player-only: "<red>Cette commande est réservée aux joueurs."
  reload-success: "<green>Configurations rechargées."
  unknown-subcommand: "<red>Sous-commande inconnue. /collector <give|reload|info|wipe>"

place:
  success: "<green>Collector posé. Clic droit pour ouvrir, Maj + clic gauche pour ramasser."
  blocked-world: "<red>Les Collectors ne peuvent pas être posés dans ce monde."
  limit-reached: "<red>Vous avez atteint votre limite de Collectors (<yellow><limit></yellow>)."
  chunk-occupied: "<red>Il y a déjà un Collector dans ce chunk."

break:
  success: "<gray>Collector ramassé. Le contenu a été déposé."
  unbreakable: "<red>Ce Collector ne peut pas être cassé. <gray>Shift + clic droit pour le ramasser."
  not-owner: "<red>Seul le propriétaire peut ramasser ce Collector."

upgrade:
  cant-afford: "<red>Fonds insuffisants. Besoin de <yellow>$<price></yellow>."
  max-tier: "<gold>Cette amélioration est déjà au maximum."
  success: "<green><yellow><track></yellow> amélioré au tier <yellow><tier></yellow> !"
  toggled-on: "<green><feature> activé."
  toggled-off: "<gray><feature> désactivé."

filter:
  whitelist: "<aqua>Filtre réglé sur WHITELIST."
  blacklist: "<aqua>Filtre réglé sur BLACKLIST."
  none: "<aqua>Filtre désactivé."

economy:
  unavailable: "<red>Aucun prix disponible pour cet objet."
  sold: "<green>Vendu pour <yellow>$<amount></yellow>."

xp:
  empty: "<red>Ce Collector n'a pas d'XP stockée."
  withdrew: "<green><yellow><amount></yellow> XP retirés du Collector."

storage:
  empty-slot: "<dark_gray>Vide"
  slot-name: "<white><material> <gray>x<yellow><amount></yellow>"
  slot-lore:
    - "<dark_gray>───────────────"
    - "<gray>Clic gauche  <dark_gray>» <white>prendre 64"
    - "<gray>Maj+clic     <dark_gray>» <white>prendre max"
    - "<gray>Clic droit   <dark_gray>» <white>prendre 1"
    - "<gray>Maj+droit    <dark_gray>» <gold>vendre la pile"
    - "<dark_gray>───────────────"

hologram:
  lines:
    - "<gold><bold>⛁ Collector</bold>"
    - "<gray>Propriétaire: <yellow><owner></yellow>"
    - "<gray>Items: <yellow><items></yellow>  <gray>XP: <green><xp></green>"
    - "<gray>$<money></gray>"

items:
  collector:
    name: "<gold><bold>⛁ Collector</bold> <gray>[Tier <yellow><tier_capacity></yellow>]"
    lore:
      - "<dark_gray>» <gray>Ramasse les items dans les chunks proches."
      - ""
      - "<gray>Vitesse:   <yellow>Tier <tier_speed>"
      - "<gray>Portée:    <yellow>Tier <tier_range>"
      - "<gray>Capacité:  <yellow>Tier <tier_capacity>"
      - ""
      - "<dark_gray>Clic droit pour ouvrir."
      - "<dark_gray>Maj + clic gauche pour ramasser."
