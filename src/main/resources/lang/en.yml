# =============================================================
#                  English (en) — language file
# =============================================================
# All strings support MiniMessage tags + legacy & color codes.
# To translate, copy this file to <code>.yml and set "language: <code>"
# in config.yml. Missing keys fall back to en.
# =============================================================

prefix: "<gold><bold>Collector</bold> <dark_gray>»</dark_gray> "

general:
  no-permission: "<red>You don't have permission to do that."
  player-only: "<red>That command is for players only."
  not-allowed: "<red>You can't access this Collector. Ask the owner to add you as a friend."
  reload-success: "<green>Configurations reloaded."
  unknown-subcommand: "<red>Unknown subcommand. /collector <give|reload|info|wipe|admin|rename|friend>"

place:
  success: "<green>Placed a Collector. Right-click to open the menu, sneak + left-click to pick up."
  blocked-world: "<red>Collectors cannot be placed in this world."
  limit-reached: "<red>You have reached your Collector limit (<yellow><limit></yellow>)."
  chunk-occupied: "<red>There is already a Collector in this chunk."

break:
  success: "<gray>Picked up Collector. Storage contents have been dropped."
  unbreakable: "<red>This Collector cannot be broken. <gray>Sneak + left-click to pick it up."
  not-owner: "<red>Only the owner can pick up this Collector."
  too-full: "<red>Cannot pick up — storage holds <yellow><total></yellow> items (limit <yellow><limit></yellow>). Withdraw some first."

gui:
  no-permission-lore:
    - ""
    - "<dark_gray>━━━━━━━━━━━━━━━━━━━━"
    - "<red>✖ <gray>ʏᴏᴜ ᴅᴏɴ'ᴛ ʜᴀᴠᴇ ᴘᴇʀᴍɪѕѕɪᴏɴ"
    - "<red>✖ <gray>ᴛᴏ ᴜѕᴇ ᴛʜɪѕ ғᴇᴀᴛᴜʀᴇ."

upgrade:
  cant-afford: "<red>Insufficient funds. Need <yellow>$<price></yellow>."
  max-tier: "<gold>This upgrade is already at maximum tier."
  success: "<green>Upgraded <yellow><track></yellow> to tier <yellow><tier></yellow>!"
  toggled-on: "<green><feature> enabled."
  toggled-off: "<gray><feature> disabled."

filter:
  whitelist: "<aqua>Filter set to WHITELIST."
  blacklist: "<aqua>Filter set to BLACKLIST."
  none: "<aqua>Filter disabled."

economy:
  unavailable: "<red>No price available for this item."
  sold: "<green>Sold for <yellow>$<amount></yellow>."

xp:
  empty: "<red>This Collector has no stored XP."
  withdrew: "<green>Withdrew <yellow><amount></yellow> XP from the Collector."

rename:
  success: "<green>Renamed Collector to <yellow><name></yellow>."
  no-target: "<red>Look at a Collector to rename it."
  usage: "<red>Usage: /collector rename <new name>"

friend:
  added: "<green>Added <yellow><name></yellow> as a friend."
  removed: "<gray>Removed <yellow><name></yellow> from friends."
  already: "<gray><name> is already a friend."
  not-friend: "<gray><name> is not a friend."
  unknown: "<red>Unknown player: <yellow><name></yellow>."
  empty: "<gray>This Collector has no friends yet."
  list-header: "<gold>Friends (<count>):"
  list-entry: "<gray>• <yellow><name>"
  no-target: "<red>Look at a Collector to manage its friends."
  usage: "<red>Usage: /collector friend <add|remove|list> [player]"

storage:
  empty-slot: "<dark_gray>Empty"
  slot-name: "<white><material> <gray>x<yellow><amount></yellow>"
  slot-lore:
    - "<dark_gray>━━━━━━━━━━━━━━━━━━━━"
    - "<gray>ʟᴇғᴛ-ᴄʟɪᴄᴋ  <dark_gray>» <white>ᴛᴀᴋᴇ 64"
    - "<gray>ѕʜɪғᴛ-ᴄʟɪᴄᴋ <dark_gray>» <white>ᴛᴀᴋᴇ ᴍᴀxɪᴍᴜᴍ"
    - "<gray>ʀɪɢʜᴛ-ᴄʟɪᴄᴋ <dark_gray>» <white>ᴛᴀᴋᴇ 1"
    - "<gray>ѕʜɪғᴛ-ʀɪɢʜᴛ <dark_gray>» <gold>ѕᴇʟʟ ѕᴛᴀᴄᴋ"
    - "<dark_gray>━━━━━━━━━━━━━━━━━━━━"

hologram:
  default-name: "Collector"
  lines:
    - "<gold><bold>⛁ <name>"
    - "<gray>ᴏᴡɴᴇʀ: <yellow><owner>"
    - "<gray>ɪᴛᴇᴍѕ: <yellow><items>  <gray>xᴘ: <green><xp>"
    - "<gray>ᴍᴏɴᴇʏ ᴇᴀʀɴᴇᴅ: <yellow>$<money>"

items:
  collector:
    name: "<gold><bold>⛁ <name></bold> <gray>[ᴛɪᴇʀ <yellow><tier_capacity></yellow>]"
    lore:
      - "<dark_gray>━━━━━━━━━━━━━━━━━━━━"
      - "<dark_gray>» <gray>ᴄᴏʟʟᴇᴄᴛѕ ᴅʀᴏᴘᴘᴇᴅ ɪᴛᴇᴍѕ ɪɴ ɴᴇᴀʀʙʏ ᴄʜᴜɴᴋѕ."
      - ""
      - "<gray>ѕᴘᴇᴇᴅ:    <yellow>ᴛɪᴇʀ <tier_speed>"
      - "<gray>ʀᴀɴɢᴇ:    <yellow>ᴛɪᴇʀ <tier_range>"
      - "<gray>ᴄᴀᴘᴀᴄɪᴛʏ: <yellow>ᴛɪᴇʀ <tier_capacity>"
      - ""
      - "<dark_gray>ʀɪɢʜᴛ-ᴄʟɪᴄᴋ ᴛᴏ ᴏᴘᴇɴ ᴛʜᴇ ᴍᴇɴᴜ."
      - "<dark_gray>ѕɴᴇᴀᴋ + ʟᴇғᴛ-ᴄʟɪᴄᴋ ᴛᴏ ᴘɪᴄᴋ ᴜᴘ."
      - "<dark_gray>━━━━━━━━━━━━━━━━━━━━"
