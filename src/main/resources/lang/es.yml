#                  Español (es) — archivo de idioma
# =============================================================

prefix: "<gold><bold>Collector</bold> <dark_gray>»</dark_gray> "

general:
  no-permission: "<red>No tienes permiso para hacer eso."
  player-only: "<red>Ese comando es solo para jugadores."
  reload-success: "<green>Configuraciones recargadas."
  unknown-subcommand: "<red>Subcomando desconocido. /collector <give|reload|info|wipe>"

place:
  success: "<green>Collector colocado. Click derecho para abrir, agacharse + click izquierdo para recoger."
  blocked-world: "<red>No se pueden colocar Collectors en este mundo."
  limit-reached: "<red>Has alcanzado tu límite de Collectors (<yellow><limit></yellow>)."
  chunk-occupied: "<red>Ya hay un Collector en este chunk."

break:
  success: "<gray>Collector recogido. El contenido ha sido soltado."
  unbreakable: "<red>Este Collector no se puede romper. <gray>Agacharse + click izquierdo para recoger."
  not-owner: "<red>Solo el dueño puede recoger este Collector."

upgrade:
  cant-afford: "<red>Fondos insuficientes. Necesitas <yellow>$<price></yellow>."
  max-tier: "<gold>Esta mejora ya está al máximo nivel."
  success: "<green>Mejorado <yellow><track></yellow> al nivel <yellow><tier></yellow>!"
  toggled-on: "<green><feature> activado."
  toggled-off: "<gray><feature> desactivado."

filter:
  whitelist: "<aqua>Filtro establecido a WHITELIST."
  blacklist: "<aqua>Filtro establecido a BLACKLIST."
  none: "<aqua>Filtro desactivado."

economy:
  unavailable: "<red>No hay precio disponible para este ítem."
  sold: "<green>Vendido por <yellow>$<amount></yellow>."

xp:
  empty: "<red>Este Collector no tiene XP almacenada."
  withdrew: "<green>Retirados <yellow><amount></yellow> XP del Collector."

storage:
  empty-slot: "<dark_gray>Vacío"
  slot-name: "<white><material> <gray>x<yellow><amount></yellow>"
  slot-lore:
    - "<dark_gray>───────────────"
    - "<gray>Click izq.  <dark_gray>» <white>tomar 64"
    - "<gray>Shift-click <dark_gray>» <white>tomar máximo"
    - "<gray>Click der.  <dark_gray>» <white>tomar 1"
    - "<gray>Shift+der.  <dark_gray>» <gold>vender pila"
    - "<dark_gray>───────────────"

hologram:
  lines:
    - "<gold><bold>⛁ Collector</bold>"
    - "<gray>Dueño: <yellow><owner></yellow>"
    - "<gray>Items: <yellow><items></yellow>  <gray>XP: <green><xp></green>"
    - "<gray>$<money></gray>"

items:
  collector:
    name: "<gold><bold>⛁ Collector</bold> <gray>[Nivel <yellow><tier_capacity></yellow>]"
    lore:
      - "<dark_gray>» <gray>Recoge ítems caídos en chunks cercanos."
      - ""
      - "<gray>Velocidad:  <yellow>Nivel <tier_speed>"
      - "<gray>Alcance:    <yellow>Nivel <tier_range>"
      - "<gray>Capacidad:  <yellow>Nivel <tier_capacity>"
      - ""
      - "<dark_gray>Click derecho para abrir."
      - "<dark_gray>Agacharse + click izquierdo para recoger."
