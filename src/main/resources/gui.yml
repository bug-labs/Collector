        - "<gray>ᴀᴅᴠᴀɴᴄᴇ ᴏɴᴇ ʟᴇᴠᴇʟ."
        - ""
        - "<gold>▶ <yellow>ᴄʟɪᴄᴋ ᴛᴏ ᴡɪᴛʜᴅʀᴀᴡ"
        - "<dark_gray>━━━━━━━━━━━━━━━━━━━━"
    withdraw-all:
      material: GLOWSTONE_DUST
      name: "<gold><bold>ᴡɪᴛʜᴅʀᴀᴡ ᴀʟʟ"
      lore:
        - "<dark_gray>━━━━━━━━━━━━━━━━━━━━"
        - "<gray>ʙᴀʟᴀɴᴄᴇ: <yellow><xp></yellow>"
        - ""
        - "<gold>▶ <yellow>ᴄʟɪᴄᴋ ᴛᴏ ᴡɪᴛʜᴅʀᴀᴡ"
        - "<dark_gray>━━━━━━━━━━━━━━━━━━━━"

common:
  buttons:
    back:
      material: ARROW
      name: "<gray>« ʙᴀᴄᴋ"
      lore:
        - "<dark_gray>ʀᴇᴛᴜʀɴ ᴛᴏ ᴛʜᴇ ᴍᴀɪɴ ᴍᴇɴᴜ."

filter:
  title: "<aqua><bold>ɪᴛᴇᴍ ғɪʟᴛᴇʀ"
  rows: 6
  mode-button:
    slot: 49
    material: COMPARATOR
    name: "<aqua>ᴍᴏᴅᴇ: <yellow><mode>"
    lore:
      - "<dark_gray>━━━━━━━━━━━━━━━━━━━━"
      - "<gray>ᴄʟɪᴄᴋ ᴛᴏ ᴄʏᴄʟᴇ:"
      - "<gray>ɴᴏɴᴇ → ᴡʜɪᴛᴇʟɪѕᴛ → ʙʟᴀᴄᴋʟɪѕᴛ"
      - "<dark_gray>━━━━━━━━━━━━━━━━━━━━"
